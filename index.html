@font-face{font-family:Galmuri;src:url('./Galmuri11.woff2') format('woff2');font-display:swap;font-weight:700}*{box-sizing:border-box}html{background:#080e29}body{margin:0;min-height:100vh;color:#fff4fc;font-family:Galmuri,monospace;background:repeating-linear-gradient(0deg,#10183a 0 30px,#1a2450 30px 32px)}button,input{font:inherit}button{cursor:pointer}main{max-width:1190px;margin:auto;padding:24px 22px 52px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:2px solid #ff73c2;padding-bottom:16px;margin-bottom:19px}.brand{font-size:clamp(14px,2vw,18px);color:#ff80ca;letter-spacing:.04em;text-shadow:2px 2px 0 #5a234f}.brand:before{content:'✦';margin-right:13px;color:#fff}.stage{font-size:13px;color:#d8c7e6;white-space:nowrap}.progress{display:flex;gap:8px;margin-bottom:19px}.progress i{height:11px;background:#212b59;flex:1;border:2px solid #485184;box-shadow:inset 2px 2px 0 #111836}.progress i.on{background:#ff58b5;border-color:#ffb2dd;box-shadow:inset 2px 2px 0 #ffd1ed,0 0 9px #ff4ab77a}.layout{display:grid;grid-template-columns:minmax(250px,.78fr) minmax(0,1.22fr);gap:18px;align-items:stretch}.scene{position:relative;min-height:590px;border:4px solid #ff9bd5;box-shadow:0 0 0 4px #121b43,0 0 0 7px #5167a5,10px 12px 0 #050b20;background:#10183a;overflow:hidden}.scene img{display:block;width:100%;height:100%;object-fit:cover;object-position:60% center;image-rendering:pixelated}.scene:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,#070c2200 52%,#070c24d8)}.scene-tag{position:absolute;z-index:1;left:17px;bottom:18px;right:17px;padding:12px 13px;background:#10183be8;border:2px solid #ff9bd5;box-shadow:4px 4px 0 #0a0d25;color:#ffe6f5;font-size:13px;line-height:1.6}.scene-tag span{color:#ff8ed1}.card{position:relative;background:#152047;border:4px solid #ff91d0;box-shadow:0 0 0 4px #151b43,0 0 0 7px #5369a6,10px 12px 0 #050b20;min-height:590px;padding:clamp(24px,3.3vw,41px);overflow:hidden}.card:before{content:'';position:absolute;inset:9px;pointer-events:none;border:1px dashed #8b82b072}.card>*{position:relative;z-index:1}.eyebrow{color:#ff9bd4;font-size:14px;letter-spacing:.02em}h1{font-size:clamp(26px,3.2vw,39px);line-height:1.42;letter-spacing:-.035em;margin:21px 0 21px;color:#fff5fc;text-shadow:3px 3px 0 #563079}p{font-size:16px;line-height:1.8;color:#e8dcf4;margin:0;max-width:680px}.clue{background:#0a1231;border:2px solid #7890d0;box-shadow:5px 5px 0 #0a0d25;position:relative;padding:21px 22px;margin:28px 5px 26px 0;color:#fff4fd;line-height:1.95;font-size:16px}.clue:before{content:'✦  단서';display:block;color:#ff94d1;font-size:13px;margin-bottom:11px;border-bottom:1px dashed #6479b4;padding-bottom:8px}.controls{display:flex;gap:11px;flex-wrap:wrap;align-items:center;margin-top:22px}input{background:#0a1231;border:2px solid #899dda;color:#fff;padding:13px 15px;min-width:175px;max-width:100%;font-size:16px;border-radius:0}input::placeholder{color:#a4acd0}input:focus,button:focus-visible,summary:focus-visible{outline:3px solid #ffbce3;outline-offset:3px}.primary,.secondary,.choices button{border-radius:0;min-height:48px;padding:12px 17px;box-shadow:4px 4px 0 #080b25;transition:transform .12s,box-shadow .12s}.primary{background:#ff63bc;color:#25102b;border:2px solid #ffd2ed;font-weight:700}.primary:hover{background:#ffa1d8;transform:translate(-2px,-2px);box-shadow:6px 6px 0 #080b25}.choices{display:grid;grid-template-columns:1fr 1fr;gap:11px;width:100%}.choices button{text-align:left;background:#101a3b;border:2px solid #8193c7;color:#fff2fc;font-size:14px;line-height:1.5}.choices button:hover,.choices button.selected{background:#532951;border-color:#ff9bd5}.message{min-height:30px;margin-top:19px;color:#ffacd9;font-size:14px;line-height:1.6}.notes{margin-top:24px;border:3px solid #6276b3;box-shadow:5px 5px 0 #060a20;background:#111a3e;padding:18px 22px}.notes strong{color:#ff8bcf;font-size:15px}.notes ul{padding-left:20px;margin:13px 0 0;color:#e6dcf3;line-height:1.9;font-size:14px}.hint{margin-top:21px;color:#d8cef2;font-size:14px}.hint summary{cursor:pointer;width:max-content;color:#ffacd9;max-width:100%}.hint p{margin-top:12px;font-size:14px}.small{font-size:14px;color:#bfc9e9}.seal{font-size:70px;color:#ff8acc;line-height:1.2;margin:18px 0}.ghost{position:absolute;right:25px;top:12px;font-size:29px;color:#ffb9e0;pointer-events:none}.card:after{content:'◆';position:absolute;right:27px;bottom:19px;color:#ff76bf77;font-size:15px}@media(max-width:850px){.layout{grid-template-columns:1fr}.scene{min-height:190px;height:210px}.scene img{object-position:center 45%}.scene-tag{left:auto;bottom:10px;right:10px;padding:7px 10px}.card{min-height:495px}}@media(max-width:550px){main{padding:16px 14px 48px}.top{align-items:flex-start}.stage{font-size:12px}.scene{height:170px;min-height:170px}.scene-tag{font-size:11px}.card{padding:26px 21px;min-height:510px}.controls input,.controls .primary{width:100%}.choices{grid-template-columns:1fr}.clue{padding:17px 16px}h1{font-size:27px}}

</style></head><body><main><header class="top"><div class="brand">저택의 비밀 방</div><div class="stage" id="stage"></div></header><div class="progress" id="progress" aria-label="진행 상황"></div><div class="layout"><div class="scene"><img src="./mansion.webp" alt="달빛 아래 불이 켜진 저택" width="132" height="74"><div class="scene-tag"><span>✦ MIDNIGHT HOUSE</span><br>핼러윈 파티가 열리는 저택</div></div><section class="card" id="game" aria-live="polite"></section></div><aside class="notes" id="notes" hidden><strong>모은 단서</strong><ul id="noteList"></ul></aside></main><script>
const rooms=[
 {label:'현관',title:'닫힌 대문',story:'파티 초대장을 들고 저택에 도착했습니다. 대문 위에는 문양 세 개가 새겨져 있습니다. 초대장 가장자리에 적힌 숫자도 그냥 장식은 아닌 듯합니다.',clue:'초대장의 작은 낙서<br>“세 개의 별을 걸고, 일곱 밤의 달을 기다려, 마름모 두 개를 그린다.”<br><br>대문 위: ☾ ◆ ★',answer:'723',placeholder:'세 자리 숫자',hint:'낙서에는 각 문양의 수가 숨겨져 있습니다.',hint2:'별은 3, 달은 7, 마름모는 2입니다. 대문 위 문양의 순서로 적어 보세요.',note:'초대장 낙서: 별 셋 / 달 일곱 / 마름모 둘'},
 {label:'거울방',title:'거울의 한마디',story:'현관을 지나자 거울 속에 낯선 그림자가 잠깐 비칩니다. 유리에는 손가락으로 쓴 듯한 글이 있습니다. 마지막 글자 옆에 작은 화살표가 첫 줄을 향해 거꾸로 그려져 있습니다.',clue:'빛이 닿지 않는 곳을 보세요.<br>달이 뜨면 문이 열립니다.<br><br>↶',answer:'달빛',placeholder:'두 글자',hint:'문장의 길이보다 각 줄이 시작되는 곳을 보세요.',hint2:'각 줄의 첫 글자 두 개를 거울의 화살표 방향으로 읽으세요.',note:'거울에 떠오른 말: 달빛'},
 {label:'복도',title:'네 개의 발소리',story:'복도에 젖은 발자국 네 쌍이 남아 있습니다. 보이지 않는 누군가가 뒤에서 걸어오는 것 같습니다. 발자국의 주인이 지나간 순서를 적어야 벽이 움직입니다.',clue:'까마귀는 여우보다 먼저 지나갔습니다.<br>여우와 고양이는 나란히 지나갔고, 고양이는 여우의 바로 뒤였습니다.<br>부엉이는 가장 늦게 지나갔습니다.',answer:'까마귀여우고양이부엉이',placeholder:'동물 네 마리의 순서',hint:'여우와 고양이를 순서가 정해진 한 쌍으로 보세요.',hint2:'부엉이는 맨 뒤입니다. 까마귀는 여우보다 앞에 놓으세요. 이름을 순서대로 입력하면 됩니다.',note:'복도 쪽지: 까마귀는 여우 앞 / 여우 바로 뒤에 고양이 / 부엉이는 마지막'},
 {label:'표본실',title:'이름 없는 서랍',story:'복도 끝 표본실에는 초대 손님을 위한 서랍 세 개가 있습니다. 유리 아래의 동물 그림과 짧은 설명을 맞춰 보세요. 서랍을 여는 순서가 암호입니다.',clue:'서랍의 그림: 박쥐 [4]　거미 [8]　개구리 [6]<br><br>① 새는 아니지만 날 수 있습니다.<br>② 곤충은 아니며 다리가 여덟 개입니다.<br>③ 올챙이에서 자랍니다.',answer:'486',placeholder:'서랍 세 개의 숫자',hint:'동물 그림과 설명을 일대일로 연결해 보세요.',hint2:'날 수 있는 포유류, 다리 여덟 개의 동물, 올챙이에서 자라는 동물 순서입니다.',note:'표본실 서랍: 박쥐 4 / 거미 8 / 개구리 6'},
 {label:'연회장',title:'비어 있는 두 자리',story:'연회장에는 손님 네 명의 이름표가 놓여 있습니다. 누군가 복도에서 지나간 순서대로 자리를 다시 놓으라고 적어 두었습니다. 빈 의자는 두 번째와 네 번째뿐입니다.',clue:'흩어진 이름표<br>부엉이 — 열쇠<br>고양이 — 빛<br>까마귀 — 달<br>여우 — 문<br><br>빈 의자에 앉을 손님의 이름표에서 한 단어씩 읽으세요.',answer:'문열쇠',placeholder:'두 단어를 붙여 입력',hint:'복도에서 알아낸 동물들의 순서대로 이름표를 놓으세요.',hint2:'순서를 맞춘 뒤 두 번째와 네 번째 이름표 뒤의 단어를 차례로 읽으세요.',note:'연회장 이름표: 까마귀=달 / 여우=문 / 고양이=빛 / 부엉이=열쇠'},
 {label:'시계방',title:'아홉 칸의 시계',story:'연회장의 문을 열자 시계방입니다. 바닥에는 숫자 아홉 개가 일정한 간격으로 놓여 있고, 문손잡이는 한 개의 로마 숫자를 요구합니다.',clue:'<div class="num-grid" aria-label="숫자 1부터 9까지 세 줄로 놓인 격자"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span></div>표본실에서 서랍을 열었던 세 숫자의 칸을 순서대로 이어 보세요. 그 모양의 로마 숫자가 문에 들어갑니다.',answer:'5',placeholder:'로마 숫자를 숫자로',hint:'표본실 암호의 첫째, 둘째, 셋째 숫자를 격자에서 차례로 찾으세요.',hint2:'4에서 8, 8에서 6으로 선을 그으면 V 모양입니다. 로마 숫자 V가 뜻하는 값을 입력하세요.',note:'시계방: 표본실 숫자 486을 잇자 V 모양이 나타남'},
 {label:'서재',title:'책장 뒤의 문',story:'시계방을 통과하자 서재가 나타납니다. 책장에는 일곱 글자가 하나씩 붙어 있고, 연회장에서 알아낸 물건을 넣을 자리가 보입니다.',clue:'별　빛　문　고　양　이　달<br><br>책장 아래의 글: “처음 잠금을 풀 때 썼던 것을 기억하라. 거울의 말로 시작하는 문만 열릴 것이다.”',answer:'달빛문',placeholder:'문 이름 세 글자',hint:'현관의 숫자를 책장에 붙은 글자의 자리와 연결해 보세요.',hint2:'왼쪽부터 글자에 1~7번을 붙이세요. 현관에서 입력한 세 숫자가 가리키는 글자를 읽으세요.',note:'책장 뒤에서 문열쇠를 사용해 다락방으로 들어감'},
 {label:'다락방',title:'셋 중 하나',story:'서재의 책장 뒤에서 다락방으로 올라왔습니다. 서랍 A, B, C 가운데 하나에 비밀의 방 열쇠가 있습니다. 서랍마다 쪽지가 붙어 있는데, 세 쪽지 중 딱 하나만 사실입니다.',clue:'A의 쪽지: “열쇠는 B에 있다.”<br>B의 쪽지: “열쇠는 B에 없다.”<br>C의 쪽지: “열쇠는 A에 없다.”<br><br>어느 서랍을 열어야 할까요?',answer:'A',placeholder:'A, B, C 중 하나',hint:'열쇠가 각 서랍에 있다고 가정하고, 참인 쪽지가 몇 개인지 세어 보세요.',hint2:'B에 있으면 A와 C가 참입니다. C에 있어도 B와 C가 참입니다. 딱 하나만 참이 되는 경우를 찾으세요.',note:'다락방: A를 열자 비밀의 방 열쇠가 나옴'},
 {label:'비밀의 방',title:'돌아 나가는 순서',story:'다락방 열쇠로 비밀의 방을 열었습니다. 안쪽의 마지막 자물쇠는 네 자리 숫자를 요구합니다. 복도에서는 동물들이 저택 안쪽으로 들어온 순서를 풀었습니다. 이번에는 밖으로 돌아 나가는 순서입니다.',clue:'문에 새겨진 그림<br>까마귀 = 시계방 문손잡이의 숫자<br>여우 = ◆　고양이 = ★　부엉이 = ☾<br><br>마지막에 들어온 동물부터 차례로 밖으로 나갑니다.',answer:'7325',placeholder:'네 자리 숫자',hint:'복도에서 맞힌 동물 순서를 거꾸로 뒤집어 보세요.',hint2:'거꾸로 된 동물 순서의 문양을 현관의 숫자로 바꾸세요. 까마귀는 시계방 로마 숫자의 값을 씁니다.'}
];let current=-1,selected='',message='';const game=document.getElementById('game');const stage=document.getElementById('stage');const progress=document.getElementById('progress');const notes=document.getElementById('notes');const noteList=document.getElementById('noteList');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function paint(){stage.textContent=current<0?'초대장':current<rooms.length?`${current+1} / ${rooms.length} · ${rooms[current].label}`:'비밀의 방';progress.innerHTML=Array.from({length:rooms.length},(_,i)=>`<i class="${i<=current?'on':''}"></i>`).join('');if(current<0){game.innerHTML='<div class="eyebrow">HALLOWEEN PARTY · INVITATION</div><h1>저택의 비밀 방</h1><p>오래된 저택에서 핼러윈 파티가 열립니다. 그런데 이곳에는 유령이 나온다는 소문이 있습니다. 장난을 치는 유령일까요, 위험한 악귀일까요?</p><div class="clue">저택 안에 숨은 비밀의 방에 다녀온 사람은 유령의 방해 없이 파티를 즐길 수 있다고 합니다.</div><p>초대장을 챙겨 저택 안으로 들어가 보세요.</p><div class="controls"><button class="primary" id="start">저택에 들어가기</button></div><div class="ghost" aria-hidden="true">✧</div>';document.getElementById('start').onclick=()=>{current=0;paint()};notes.hidden=true;return}if(current===rooms.length){game.innerHTML='<div class="eyebrow">SECRET ROOM · CLEAR</div><h1>부적을 찾았습니다</h1><p>비밀의 방에 다녀왔다는 증표입니다. 사진 위에 얹을 수 있도록 투명 배경 스티커로 저장해 보세요.</p><div class="sticker-wrap"><canvas id="sticker" width="48" height="48" role="img" aria-label="노란 종이 부적에 그려진 분홍 유령과 X 표시"></canvas><div><div class="sticker-title">악귀퇴치 부적</div><p class="small">투명 배경 PNG · 576 × 576</p><button class="primary" id="download">PNG 스티커 저장</button></div></div><div class="controls"><button class="secondary" id="restart">처음부터 다시 풀기</button></div>';drawSticker();document.getElementById('download').onclick=downloadSticker;document.getElementById('restart').onclick=()=>{current=-1;selected='';message='';paint()};return}const r=rooms[current];let control=r.choices?`<div class="choices" role="group" aria-label="순서 선택">${r.choices.map(x=>`<button type="button" data-choice="${esc(x)}" class="${selected===x?'selected':''}" aria-pressed="${selected===x}">${esc(x)}</button>`).join('')}</div>`:`<input id="answer" aria-label="정답" autocomplete="off" placeholder="${r.placeholder}" maxlength="20">`;game.innerHTML=`<div class="eyebrow">ROOM 0${current+1} / ${esc(r.label)}</div><h1>${esc(r.title)}</h1><p>${esc(r.story)}</p><div class="clue">${r.clue}</div><form id="form"><div class="controls">${control}<button class="primary" type="submit">문 열기</button></div></form><div class="message" role="status">${esc(message)}</div><details class="hint"><summary>힌트 1 보기</summary><p>${esc(r.hint)}</p><details class="hint-more"><summary>힌트 2 보기</summary><p>${esc(r.hint2)}</p></details></details><div class="ghost" aria-hidden="true">✧</div>`;game.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{selected=b.dataset.choice;game.querySelectorAll('[data-choice]').forEach(x=>{x.classList.toggle('selected',x===b);x.setAttribute('aria-pressed',x===b)})});document.getElementById('form').onsubmit=e=>{e.preventDefault();let value=r.choices?selected.replaceAll(' → ',' '):(document.getElementById('answer').value.trim().replaceAll(/\s/g,''));if(value.replace(/[\s→,，·-]/g,'').toUpperCase()===r.answer.replace(/[\s→,，·-]/g,'').toUpperCase()){current++;selected='';message='';updateNotes();paint()}else{message=value?'암호가 맞지 않습니다. 단서를 다시 살펴보세요.':'정답을 입력하거나 선택해 주세요.';game.querySelector('.message').textContent=message}};updateNotes()}
function updateNotes(){noteList.innerHTML=rooms.slice(0,current).filter(x=>x.note).map(x=>`<li>${esc(x.note)}</li>`).join('');notes.hidden=current<=0||current===rooms.length}function drawSticker(){const c=document.getElementById('sticker'),ctx=c.getContext('2d');ctx.clearRect(0,0,48,48);const px=(x,y,w,h,color)=>{ctx.fillStyle=color;ctx.fillRect(x,y,w,h)};const ink='#d52184',edge='#503255',yellow='#ffda51',paper='#ffeb86',ghost='#ff67bd';
// Straight, vertical paper talisman with stepped pixel corners.
px(13,1,22,2,edge);px(11,3,26,40,edge);px(13,43,22,3,edge);
px(13,3,22,40,yellow);px(15,5,18,36,paper);px(13,41,22,2,yellow);
px(14,4,20,2,ink);px(14,40,20,2,ink);
px(16,8,16,2,ink);px(22,10,4,7,ink);px(17,13,14,2,ink);px(18,16,12,2,ink);
// A tiny pink ghost: square pixels, no blur or antialiasing.
px(21,22,6,2,ghost);px(19,24,10,8,ghost);px(18,27,12,5,ghost);px(18,31,3,3,ghost);px(23,31,3,3,ghost);px(28,31,2,3,ghost);
px(21,26,2,2,edge);px(26,26,2,2,edge);
// The crossed seal is drawn last, so the X visibly covers the ghost.
for(let i=0;i<15;i++){px(16+i,20+i,2,2,ink);px(30-i,20+i,2,2,ink)}
px(18,37,12,2,ink)}
function downloadSticker(){const src=document.getElementById('sticker'),out=document.createElement('canvas');out.width=576;out.height=576;const ctx=out.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.drawImage(src,0,0,576,576);const a=document.createElement('a');a.download='halloween-ward-sticker.png';a.href=out.toDataURL('image/png');document.body.appendChild(a);a.click();a.remove()}
paint();
</script></body></html>
